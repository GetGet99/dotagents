[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotagents"
version = "0.1.0"
description = "Manage agent rules and skills across multiple harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "tomli-w>=1.0"]

[project.scripts]
dotagents = "dotagents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "src"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.0", "types-PyYAML>=6"]
